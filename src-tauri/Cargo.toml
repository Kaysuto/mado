[package]
name = "madow"
version = "0.2.0"
description = "The all-in-one workspace for developers, with the AI model of your choice"
authors = ["Kaysuto"]
license = "MIT"
repository = "https://github.com/Kaysuto/madow"
edition = "2024"
rust-version = "1.90"

[lib]
name = "madow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
chrono = "0.4.45"
futures = "0.3.34"
icalendar = { version = "0.17.17", features = ["parser", "recurrence"] }
keyring = "4.2.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6" }
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.12"
which = "8.0.6"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wiremock = "0.6.5"
